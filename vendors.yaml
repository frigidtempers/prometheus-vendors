# =====================================================================
#  VENDORS
# =====================================================================
# How to read this file:
#
#   reset:        weekly, monthly, daily, or static
#                 (static vendors never restock on their own; they only
#                 post when you run the workflow by hand)
#   reset_day:    weekly: a weekday name (monday ... sunday)
#                 monthly: a day of the month (1-31; 31 means "last day")
#   webhook_secret: the name of the GitHub secret holding this channel's
#                 webhook URL (see SETUP.md)
#   thread_id:    only needed if the vendor is a post in a Forum channel.
#                 Right-click the post > Copy Link; the last number is the ID.
#   image_url:    must be a permanent link. Discord attachment links expire,
#                 so put the picture in this repo's images/ folder and use its
#                 raw GitHub link (see SETUP.md).
#   budget:       a number ("10000"), a dice roll ("2D6*1000+1D1000"),
#                 or any text ("CAN NOT BUY"). Leave blank to hide it.
#
# Each section has:
#   title:   the italic heading (Armor, Weapons, ...)
#   count:   how many items to pick from the pool (dice allowed: "1D3+3")
#   always:  items that are always in stock (optional)
#   pool:    items that might be in stock
#     weight: how likely compared to the others (default 1; 2 = twice as
#             likely, 0.5 = half as likely)
#     qty:    how many are in stock (default 1; dice allowed: "1D3")
#
# Dice: "2D" or "2D6" = two six-sided dice, "1D3" = 1 to 3, "1D100", etc.
# You can add, subtract and multiply: "2D6*1000+1D1000".
# =====================================================================

timezone: America/Chicago

vendors:

  # -------------------------------------------------------------------
  jacks_shack:
    name: "Jack's Shack"
    enabled: true
    reset: monthly
    reset_day: 1
    webhook_secret: JACKS_SHACK_WEBHOOK
    thread_id: ""
    username: "Jack's Shack"
