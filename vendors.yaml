          - { name: "Mesh", weight: 2 }
          - { name: "Cloth", weight: 2 }
          - { name: "Ablat" }
          - { name: "Reflec", weight: 0.5 }
          - { name: "Ballistic Vest", weight: 2 }
          - { name: "Vacc Suit" }
      - title: Weapons
        count: "1D3+3"
