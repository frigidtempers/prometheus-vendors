name: Vendor Restock

on:
  # Runs once a day. The script decides which vendors are due.
  # 14:17 UTC = 8:17am Chicago time (9:17am during daylight saving).
  schedule:
    - cron: "17 14 * * *"

  # Lets you run it by hand from the Actions tab.
  workflow_dispatch:
    inputs:
      vendor:
        description: "Vendor id (e.g. jacks_shack), 'all', or blank for whoever is due today"
        required: false
        default: ""
      force:
        description: "Reroll even if this vendor already rolled today"
        type: boolean
        default: false
      dry_run:
        description: "Dry run (show the rolls in the log, don't post to Discord)"
        type: boolean
        default: false

permissions:
  contents: write   # so it can save state.json (used for delete_previous)

concurrency:
  group: vendor-restock
  cancel-in-progress: false

jobs:
  restock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Roll vendors
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          VENDOR: ${{ github.event.inputs.vendor }}
          FORCE: ${{ github.event.inputs.force }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS=()
          if [ -n "$VENDOR" ]; then ARGS+=(--vendor "$VENDOR"); fi
          if [ "$FORCE" = "true" ]; then ARGS+=(--force); fi
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          python roll_vendors.py "${ARGS[@]}"

      - name: Save state
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "vendor-restock-bot"
            git config user.email "vendor-restock-bot@users.noreply.github.com"
            git add state.json
            git commit -m "Update vendor restock state"
            git push
          fi
